name: devpilot

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8765:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PYTHONPATH: /app
      LOCAL_STORAGE_PATH: /app/storage
      DATABASE_URL: sqlite:////app/data/agentic_devops.db
      DEVPILOT_REPOSITORY_ROOT: /app/repositories
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
      - ./data/repositories:/app/repositories
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  frontend_node_modules:
